name: AI Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testleri çalıştır
        run: npm test

      - name: Copilot CLI'yi kur
        run: npm install -g @github/copilot

      - name: Copilot PR'ı incelesin
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          copilot --agent pr-inceleyici \
            -p "git diff origin/${{ github.base_ref }}...HEAD çıktısını incele ve raporu review.md dosyasına yaz." \
            --allow-tool 'shell(git diff)' \
            --allow-tool 'shell(git log)' \
            --allow-tool 'write'

      - name: Raporu PR'a yorum olarak ekle
        if: always() && hashFiles('review.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.number }} --body-file review.md
